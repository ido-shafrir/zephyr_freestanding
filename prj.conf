# This project configuration is the default file expected by the build system.
# Unless a different file is specified using the `CONF_FILE` CMake variable, you'll need to
# provide this file even if it is empty.
#
# This template ships with optional features in src/ and include/ that are NOT
# compiled by default. To enable a feature you typically need three things:
#   1. Add the source file(s) to CMakeLists.txt
#   2. Uncomment the matching `# === <feature> ===` block below
#   3. (For event_log) ensure the board overlay defines event_log_partition
# See docs/feature_selection_guide.md for the per-feature recipe.

CONFIG_GPIO=y # Enable GPIO support, which is commonly used for controlling LEDs and reading button states.
CONFIG_PRINTK=y # Enable printk support for debugging output.

# === Logging ===
# CONFIG_LOG=y
# CONFIG_LOG_DEFAULT_LEVEL=3   # 0=off, 1=err, 2=warn, 3=info, 4=dbg

# === Persistent config (config_store: src/config_store.c) ==================
# Stores key-value settings on a dedicated flash partition (ZMS backend).
# Requires storage_partition in the board overlay (already defined in
# boards/nucleo_h753zi.overlay).
# CONFIG_FLASH=y
# CONFIG_FLASH_MAP=y
# CONFIG_FLASH_PAGE_LAYOUT=y
# CONFIG_ZMS=y
# CONFIG_SETTINGS=y
# CONFIG_SETTINGS_ZMS=y

# === Networking (W5500 + DHCP + sockets) ====================================
# Required by REST API, OTA, and any feature that talks over the network.
# CONFIG_NETWORKING=y
# CONFIG_NET_IPV4=y
# CONFIG_NET_TCP=y
# CONFIG_NET_UDP=y
# CONFIG_NET_SOCKETS=y
# CONFIG_NET_DHCPV4=y
# CONFIG_NET_L2_ETHERNET=y
# CONFIG_ETH_W5500=y
# CONFIG_SPI=y

# === HTTP server (REST API: src/rest_api.c) =================================
# Optional, requires Networking above.
# CONFIG_HTTP_SERVER=y
# CONFIG_HTTP_PARSER=y
# CONFIG_HTTP_PARSER_URL=y
# CONFIG_JSON_LIBRARY=y
# CONFIG_ZVFS=y
# CONFIG_ZVFS_EVENTFD=y
# CONFIG_ZVFS_EVENTFD_MAX=4   # bug_reports/016 — default of 1 is too small

# === MCUboot OTA + MCUmgr (UDP transport: src/ota.c) =======================
# Requires Networking above and a sysbuild build (`west build --sysbuild`).
# CONFIG_BOOTLOADER_MCUBOOT=y
# CONFIG_IMG_MANAGER=y
# CONFIG_STREAM_FLASH=y
# CONFIG_MCUMGR=y
# CONFIG_MCUMGR_TRANSPORT_UDP=y
# CONFIG_MCUMGR_GRP_IMG=y
# CONFIG_MCUMGR_GRP_OS=y

# === Event log (FCB ring: src/event_log.c) =================================
# Requires config_store, an event_log_partition in the board overlay
# (already defined in boards/nucleo_h753zi.overlay), and CONFIG_LOG above.
# CONFIG_FCB=y
# CONFIG_CRC=y

# === Time service (SNTP: src/time_service.c) ===============================
# Requires Networking and config_store above.
# CONFIG_SNTP=y
# CONFIG_POSIX_API=y
# CONFIG_POSIX_TIMERS=y
# CONFIG_DNS_RESOLVER=y
# CONFIG_DNS_SERVER_IP_ADDRESSES=y
# CONFIG_DNS_SERVER1="8.8.8.8"