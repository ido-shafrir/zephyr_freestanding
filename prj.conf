# ─── Networking Core ───
# This pulls in Zephyr's entire network stack.
# Without this, there ARE no sockets.
CONFIG_NETWORKING=y 
CONFIG_NET_L2_ETHERNET=y

# ─── TCP/IP Stack ───
# Enable the protocols we need.
# IPv4 only — keep it simple for now.
CONFIG_NET_IPV4=y
CONFIG_NET_IF_MAX_IPV4_COUNT=2
CONFIG_NET_TCP=y
CONFIG_NET_ARP=y
CONFIG_NET_ARP_TABLE_SIZE=8

# We don't need IPv6 for a local REST server
CONFIG_NET_IPV6=n

# ─── Sockets API ───
# This gives you zsock_socket(), zsock_bind(), etc.
# The "POSIX" API wraps these to look exactly like Linux sockets.
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y

# ─── Static IP Configuration ───
# ADJUST THESE to match your subnet!
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="10.10.10.10"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="10.10.10.1"

# ─── SPI ───
CONFIG_SPI=y

# ─── W5500 Driver ───
# This single line pulls in the W5500 Ethernet driver.
# Zephyr matches it to the devicetree node via "compatible".
CONFIG_ETH_W5500=y

# ─── Buffer Configuration ───
# Network buffers — start generous, tune later.
# Each packet needs buffer space. Too few = dropped packets.
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048

# ─── Logging (CRUCIAL for debugging) ───
CONFIG_LOG=y
CONFIG_NET_LOG=y
CONFIG_ETHERNET_LOG_LEVEL_INF=y

# ─── Main thread stack ───
# HTTP parsing needs some stack space
CONFIG_MAIN_STACK_SIZE=4096

# ─── GPIO (needed for CS and INT pins) ───
CONFIG_GPIO=y

# ─── UART ───
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y