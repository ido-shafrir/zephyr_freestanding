# MCUboot bootloader configuration for STM32H753ZI
#
# This file is automatically picked up by sysbuild when
# SB_CONFIG_BOOTLOADER_MCUBOOT=y is set in sysbuild.conf.

# ─── Swap algorithm ───
# Use scratch-based swap. The scratch partition is defined in the
# nucleo_h753zi.overlay (128 KB at 0x081E0000).
CONFIG_BOOT_SWAP_USING_SCRATCH=y

# ─── Sector count ───
# Each slot is 896 KB = 7 × 128 KB sectors. MCUboot needs to know
# the max sectors per slot for its swap state tracking.
CONFIG_BOOT_MAX_IMG_SECTORS=16

# ─── Logging ───
CONFIG_LOG=y
CONFIG_MCUBOOT_LOG_LEVEL_INF=y

# ─── Serial recovery (disabled — we use UDP) ───
CONFIG_MCUBOOT_SERIAL=n

# ─── Flash backend ───
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# ─── GPIO (MCUboot may need it for boot pin detection) ───
CONFIG_GPIO=y

# ─── Stack size ───
# RSA-2048 signature verification is stack-hungry (~8 KB).
# Default main stack (often 2–4 KB) causes stack overflow on STM32H7.
CONFIG_MAIN_STACK_SIZE=16384

# ─── Signing ───
# Uses the default MCUboot test key for development.
# For production, generate your own key pair and set:
# CONFIG_BOOT_SIGNATURE_KEY_FILE="path/to/your-key.pem"
