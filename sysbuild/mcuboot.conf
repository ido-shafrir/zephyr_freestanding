# MCUboot bootloader configuration
#
# This file is automatically picked up by sysbuild when
# SB_CONFIG_BOOTLOADER_MCUBOOT=y is set in sysbuild.conf.

# ─── Swap algorithm ───
# Use scratch-based swap. The scratch partition must be defined
# in the board's DTS overlay.
CONFIG_BOOT_SWAP_USING_SCRATCH=y

# ─── Sector count ───
# Must be >= the number of sectors in the largest slot.
# Set to 16 for headroom.
CONFIG_BOOT_MAX_IMG_SECTORS=16

# ─── Logging ───
CONFIG_LOG=y
CONFIG_MCUBOOT_LOG_LEVEL_INF=y

# ─── Serial recovery (disabled — we use UDP) ───
CONFIG_MCUBOOT_SERIAL=n

# ─── Flash backend ───
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# ─── GPIO (MCUboot may need it for boot pin detection) ───
CONFIG_GPIO=y

# ─── Stack size ───
# RSA-2048 signature verification uses mbedTLS bignum math which
# is deeply recursive. Default 2-4 KB stack causes stack overflow.
# See bug_reports/006.
CONFIG_MAIN_STACK_SIZE=16384
